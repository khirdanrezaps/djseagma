; Project-wide defaults for per-user editor settings (UE 5.8).
; The Model Context Protocol server settings live in this config category, not in DefaultEngine.ini.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; Start the MCP server automatically when the editor opens, so AI tools (Claude Code etc.)
; can drive the editor. Default endpoint: http://127.0.0.1:8000/mcp
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp
