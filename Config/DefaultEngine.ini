; DJ Seagma Anim - project engine config (UE 5.8)
;
; Plugins themselves (PythonScriptPlugin, PythonFoundationPackages, EditorScriptingUtilities,
; SequencerScripting, MovieRenderPipeline, ModelContextProtocol, AllToolsets) are enabled in
; DJSeagma_Anim.uproject - Unreal reads plugin on/off state from there, not from this file.
; This file holds the settings for those plugins and the renderer.

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Generates Python stubs (unreal.py) under Intermediate/PythonStub so IDEs autocomplete the API
bDeveloperMode=True
; Lets external tools (e.g. VS Code "Unreal Engine Python") send scripts to the open editor
bRemoteExecution=True
bIsolateInterpreterEnvironment=True

[/Script/Engine.RendererSettings]
; Lumen GI + reflections so the emissive light tubes light the scene and the chrome logo reflects
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; Fixed exposure: the cinematic controls brightness itself (fade-in, strobes)
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
; Volumetric fog for the smoke / cloud atmosphere and the light-tube glow
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
